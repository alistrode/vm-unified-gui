<!doctype html>
<html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux Unified Workspace</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex}iframe{display:block;width:100%;height:100%;border:0;min-width:0;flex:1}</style>
<script>
let currentMode=0,currentWidth=0,currentViewportWidth=0,pending=false;
function display(mode,width){document.body.replaceChildren();for(const cid of(mode===1?['a','b','c']:[null])){const f=document.createElement('iframe');f.title=cid?'Ubuntu desktop '+cid.toUpperCase():'Unified Ubuntu desktop';f.dataset.desktop=cid||'';f.allow='clipboard-read; clipboard-write; fullscreen';const q=new URLSearchParams({encoding:'png',floating_menu:'false',autoconnect:'true',sharing:'true',override_width:mode===1?width/3:1280});if(cid)q.set('path','/desktop/'+cid+'/');f.src='/display/?'+q;document.body.append(f)}}
async function synchronize(){if(pending)return;pending=true;try{const r=await fetch('/api/mode',{cache:'no-store'});if(!r.ok)return;let d=await r.json();if(d.mode===1){const width=Math.min(7680,Math.max(2400,Math.round(innerWidth/24)*24));const height=Math.min(6000,Math.max(600,Math.round(innerHeight*width/innerWidth/2)*2));if(d.width!==width||Math.abs(d.height-height)>2){const r=await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({width,height})});if(!r.ok)return;d=await r.json()}}if(currentMode!==d.mode||currentWidth!==d.width||currentViewportWidth!==innerWidth){currentMode=d.mode;currentWidth=d.width;currentViewportWidth=innerWidth;display(d.mode,d.width)}const ready=[];for(const frame of document.querySelectorAll('iframe')){if(!frame.contentWindow?.client?.connected){delete frame.dataset.inputReady;continue}if(!frame.dataset.inputReady)ready.push(frame)}if(ready.length){const r=await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inputReady:true,desktops:ready.map(f=>f.dataset.desktop||null)})});if(r.ok)for(const f of ready)f.dataset.inputReady='true'}}catch(e){console.warn('Desktop connection will retry')}finally{pending=false}}
addEventListener('DOMContentLoaded',()=>{synchronize();setInterval(synchronize,1500)});
</script></html>
